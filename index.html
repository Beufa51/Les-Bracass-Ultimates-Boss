<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Les Bracass'</title>
  <!-- ajouté à l'écran d'accueil (iPhone, Android) : le jeu s'ouvre en plein écran, comme une appli -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bracass'">
  <meta name="theme-color" content="#111111">
  <link rel="apple-touch-icon" href="assets/ui/icone_192.png">
  <style>
    html, body { margin: 0; height: 100%; height: 100dvh; background: #111; overflow: hidden; touch-action: none; overscroll-behavior: none; }
    #jeu { width: 100%; height: 100%; }
    /* coupure de courant (battle de Kédric) : écran noir PAR-DESSUS TOUT, même les boutons de la page.
       pointer-events:none → les boutons restent appuyables À TRAVERS le voile (garde le rythme en tête) */
    #noir { display: none; position: fixed; inset: 0; z-index: 40; background: #000; pointer-events: none; }
    /* téléphone tenu en vertical : on demande de le tourner */
    #tourner { display: none; position: fixed; inset: 0; z-index: 50; background: #111; color: #ffd84a;
      font: bold 22px monospace; text-align: center; align-items: center; justify-content: center; padding: 20px; }
    @media (orientation: portrait) and (pointer: coarse) { #tourner { display: flex; } }
  </style>
</head>
<body>
  <div id="jeu"></div>
  <div id="noir"></div>
  <div id="tourner">⟳<br><br>Tourne ton téléphone<br>à l'horizontale<br>pour jouer !</div>
  <!-- Moteur Phaser 3 (gratuit, licence MIT), copié dans lib/ pour marcher sans Internet -->
  <script src="lib/phaser.min.js"></script>
  <script type="module" src="src/main.js"></script>
  <script>
    // toujours la dernière version (voir sw.js) ; la toute première fois, on recharge une fois pour en profiter
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      const avait = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.register('sw.js').catch(() => {});
      navigator.serviceWorker.addEventListener('controllerchange', () => { if (!avait && !sessionStorage.getItem('swRecharge')) { sessionStorage.setItem('swRecharge', '1'); location.reload(); } });
    }
  </script>
</body>
</html>
